[package]
name        = "freebox-server"
version     = "0.1.0"
edition     = "2021"
description = "FreeBox backend server — Axum REST API + WebSocket gateway"
license     = "Apache-2.0"

[[bin]]
name = "freebox-server"
path = "src/main.rs"

[dependencies]
# Internal crates
freebox-core   = { workspace = true }
freebox-crypto = { workspace = true }
freebox-storage-local = { path = "../../plugins/storage-local" }

# Web framework
axum           = { workspace = true }
tower          = { workspace = true }
tower-http     = { workspace = true }
tokio          = { workspace = true }
tokio-util     = { workspace = true }

# Database
sqlx           = { workspace = true }

# Serialization
serde          = { workspace = true }
serde_json     = { workspace = true }

# Auth
jsonwebtoken   = "9.3"
argon2         = "0.5"

# OAuth2
oauth2         = "5.0"
reqwest        = { version = "0.12", features = ["json", "rustls-tls"] }
url            = "2"

# Error handling
anyhow         = { workspace = true }
thiserror      = { workspace = true }

# Observability
tracing        = { workspace = true }
tracing-subscriber = { workspace = true }

# Utilities
uuid           = { workspace = true }
chrono         = { workspace = true }
bytes          = { workspace = true }
base64         = { workspace = true }

# Config from environment
dotenvy        = "0.15"

[dev-dependencies]
axum-test      = "14.0"
tokio          = { workspace = true }
